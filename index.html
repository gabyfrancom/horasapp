<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<!-- Endurecimiento: limita de dónde se carga código y a dónde se pueden enviar datos -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://esm.sh https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
<meta name="theme-color" content="#0a0e1a" />
<meta name="description" content="HorasApp Pro — control de horas trabajadas, ETT, hoteles, servicios y cobros." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HorasApp Pro" />
<title>HorasApp Pro</title>
<style>
/* ============================================================
   HorasApp Pro — Estilos (oscuro premium, mobile-first)
   ============================================================ */
:root{
  --bg:#070b16; --bg2:#0a0e1a; --surface:#111726; --surface2:#161d30;
  --card:#141b2e; --line:#212b45; --line2:#2c3a5e;
  --txt:#eef2ff; --muted:#8a96b5; --muted2:#5d6a8c;
  --brand:#5b8cff; --brand2:#7aa2ff; --accent:#16d6a4; --warn:#ffb020;
  --danger:#ff5c7a; --ok:#19c37d; --info:#4cc9f0; --purple:#a78bfa;
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-tema="claro"]{
  --bg:#eef1f7; --bg2:#f5f7fc; --surface:#ffffff; --surface2:#f0f3fa;
  --card:#ffffff; --line:#e2e7f2; --line2:#d3dbec;
  --txt:#0d1326; --muted:#5b667f; --muted2:#8693ad;
  --shadow:0 8px 24px rgba(40,60,120,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #14213f 0%, var(--bg) 55%, var(--bg) 100%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit;}
button{cursor:pointer; border:none; background:none;}
a{color:var(--brand2); text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:8px;}

/* Layout */
#app{max-width:540px; margin:0 auto; min-height:100%; position:relative;}
.topbar{
  position:sticky; top:0; z-index:40;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  background:linear-gradient(180deg, var(--bg2) 70%, transparent);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.topbar h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-.3px;}
.topbar .sub{font-size:11.5px; color:var(--muted); font-weight:600;}
.brandmark{display:flex; align-items:center; gap:10px;}
.brandmark .logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--brand),var(--purple));
  display:grid;place-items:center;font-weight:900;color:#fff;font-size:17px;
  box-shadow:0 6px 16px rgba(91,140,255,.45);
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line); display:grid;place-items:center;color:var(--txt);
}
main{padding:6px 14px 120px; animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Tipografía / títulos */
.section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 10px;}
.muted{color:var(--muted);} .small{font-size:12.5px;}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card+.card{margin-top:12px;}
.row{display:flex;gap:12px;} .row>*{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* Hero totales */
.hero{
  background:linear-gradient(135deg,#1b2950,#0f1730);
  border:1px solid var(--line2); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(122,162,255,.35),transparent 70%);}
.hero .label{font-size:12px;color:var(--muted);font-weight:700;}
.hero .big{font-size:34px;font-weight:900;letter-spacing:-1px;margin:2px 0;}
.hero .sub{font-size:13px;color:var(--brand2);font-weight:700;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.kpi .k-val{font-size:21px;font-weight:850;margin-top:3px;}
.kpi .k-val.sm{font-size:17px;}

/* Tarjeta jornada */
.j-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;display:flex;gap:12px;align-items:stretch;margin-bottom:10px;position:relative;overflow:hidden;}
.j-card .bar{width:5px;border-radius:6px;flex:0 0 5px;}
.j-card .body{flex:1;min-width:0;}
.j-card .ett{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px;}
.j-card .meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.j-card .nums{text-align:right;flex:0 0 auto;}
.j-card .bruto{font-weight:850;font-size:16px;}
.j-card .neto{font-size:12px;color:var(--accent);font-weight:700;}
.j-card .hrs{font-size:12px;color:var(--muted);}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;}
.chip.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.c-planeada{background:rgba(76,201,240,.15);color:#76d7f5;}
.c-confirmada{background:rgba(25,195,125,.16);color:#3fe09a;}
.c-pendiente{background:rgba(255,176,32,.16);color:#ffc04d;}
.c-cobrada{background:rgba(122,162,255,.18);color:#9ab6ff;}
.c-cancelada{background:rgba(255,92,122,.16);color:#ff8197;}
.c-revision{background:rgba(167,139,250,.18);color:#c4b1ff;}
.c-neutra{background:var(--surface2);color:var(--muted);}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--txt);
  padding:13px 16px;border-radius:14px;font-weight:800;font-size:14.5px;width:100%;transition:.15s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--brand),#4470e6);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(91,140,255,.4);}
.btn.accent{background:linear-gradient(135deg,var(--accent),#0fae85);border-color:transparent;color:#04231b;}
.btn.ghost{background:transparent;}
.btn.danger{background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.3);color:#ff8197;}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:11px;}
.btn-row{display:flex;gap:10px;} .btn-row .btn{width:auto;flex:1;}
.fab-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px;}
.fab-quick .btn{flex-direction:column;gap:6px;padding:14px 6px;font-size:11.5px;}
.fab-quick .btn .ic{font-size:20px;}

/* Forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
.input,select.input,textarea.input{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 13px;color:var(--txt);outline:none;transition:.15s;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,140,255,.18);}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,92,122,.18);}
textarea.input{resize:vertical;min-height:64px;}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%238a96b5' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:38px;}
.hint{font-size:11.5px;color:var(--muted2);margin-top:5px;}

/* Acordeón */
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:11px;background:var(--card);}
.acc>summary{list-style:none;cursor:pointer;padding:14px 15px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.acc>summary::-webkit-details-marker{display:none;}
.acc>summary .arrow{transition:.2s;color:var(--muted);}
.acc[open]>summary .arrow{transform:rotate(180deg);}
.acc .acc-body{padding:0 15px 15px;}

/* Segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);}
.seg button.on{background:var(--brand);color:#fff;}

/* Bottom nav */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  margin:0 auto;max-width:540px;
  background:rgba(10,14,26,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:8px 4px calc(8px + var(--safe-bot));
}
[data-tema="claro"] .tabbar{background:rgba(255,255,255,.92);}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:700;padding:4px 2px;border-radius:10px;}
.tabbar button svg{width:23px;height:23px;}
.tabbar button.on{color:var(--brand2);}
.tabbar button.on svg{filter:drop-shadow(0 2px 6px rgba(91,140,255,.5));}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 0;}
.cal-day{aspect-ratio:1;border-radius:11px;background:var(--surface);border:1px solid var(--line);padding:5px 4px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;transition:.12s;}
.cal-day:active{transform:scale(.94);}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day.today{border-color:var(--brand);}
.cal-day.sel{background:var(--brand);color:#fff;}
.cal-day .num{font-size:13px;font-weight:800;}
.cal-day .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap;justify-content:center;}
.cal-day .dot{width:6px;height:6px;border-radius:50%;}
.cal-day .euro{font-size:8.5px;font-weight:800;color:var(--accent);}
.cal-day.sel .euro{color:#cfe0ff;}

/* Tabla resumen */
.tline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.tline:last-child{border-bottom:none;}
.tline b{font-weight:800;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* Alertas */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:13px;font-size:13px;font-weight:600;margin-bottom:9px;border:1px solid;}
.alert.warn{background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.3);color:#ffce80;}
.alert.danger{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.3);color:#ff9caf;}
.alert.info{background:rgba(76,201,240,.1);border-color:rgba(76,201,240,.3);color:#9be3fb;}
.alert.ok{background:rgba(25,195,125,.1);border-color:rgba(25,195,125,.3);color:#7fe7ba;}
.alert .ic{font-size:17px;line-height:1;}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(2,5,12,.66);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:8px 16px calc(24px + var(--safe-bot));animation:up .26s cubic-bezier(.2,.9,.3,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal .grip{width:42px;height:5px;background:var(--line2);border-radius:3px;margin:8px auto 12px;}
.modal h2{font-size:18px;margin:2px 0 14px;font-weight:850;}
.modal-x{position:absolute;}

/* Toast */
#toast-wrap{position:fixed;left:0;right:0;bottom:96px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{background:#1c2541;border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);animation:up .25s;max-width:90%;}
.toast.ok{border-color:rgba(25,195,125,.5);} .toast.err{border-color:rgba(255,92,122,.5);}

/* Misc */
.pill-color{width:14px;height:14px;border-radius:5px;display:inline-block;flex:0 0 auto;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:40px;margin-bottom:8px;}
.list-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;}
.list-item .body{flex:1;min-width:0;}
.list-item .title{font-weight:800;font-size:14px;}
.list-item .sub{font-size:12px;color:var(--muted);}
.search{position:relative;}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search .input{padding-left:42px;}
.switch{position:relative;width:46px;height:27px;flex:0 0 auto;}
.switch input{display:none;}
.switch .sl{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.2s;}
.switch .sl:before{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;}
.switch input:checked+.sl{background:var(--accent);}
.switch input:checked+.sl:before{transform:translateX(19px);}
.badge-n{background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;margin-left:6px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--surface2);color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brandmark">
      <img class="logo" src="icons/icon-192.png" alt="HorasApp Pro" style="object-fit:cover" />
      <div>
        <h1>HorasApp <span style="color:var(--brand2)">Pro</span></h1>
        <div class="sub" id="topSub">Tu tablero de control laboral</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnPrivacidad" title="Ocultar / mostrar importes"></button>
      <button class="icon-btn" id="btnTema" title="Tema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar"></nav>
<div id="toast-wrap"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   HorasApp Pro — Lógica (Vanilla JS, sin dependencias)
   Almacenamiento local (localStorage) con clave estable.
   Estructura preparada para migrar a backend (ver capa DB).
   ============================================================ */

"use strict";

/* ---------- Constantes y catálogos ---------- */
const STORAGE_KEY = "horasapp_pro_v1";       // clave estable: no cambiar entre versiones
const APP_VERSION = "1.0.0";

const ESTADOS_JORNADA = [
  "Planeada","Confirmada","Pendiente de validar","Enviada a ETT",
  "Aceptada","Rechazada","Corregida","Cancelada"
];
const ESTADOS_COBRO = ["Pendiente de cobro","Parcialmente cobrada","Cobrada","En revisión"];
const ESTADOS_PARTE = ["Sin enviar","Enviado","Aceptado","Rechazado","Corregido"];
const SERVICIOS_SUGERIDOS = ["Veranda","Txoko","Lobby","Sala","Cocina","Office","Recepción","Limpieza","Auditoría","Extra"];
const COLORES = ["#5b8cff","#16d6a4","#ffb020","#ff5c7a","#a78bfa","#4cc9f0","#f472b6","#34d399","#fb923c","#60a5fa"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DOW = ["L","M","X","J","V","S","D"];

/* ---------- Utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };

function money(n){
  const c = state?.config?.moneda || "€";
  if(state?.config?.ocultarMontos) return `••••• ${c}`;   // modo privacidad
  const v = (Math.round((n||0)*100)/100).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${v} ${c}`;
}
function fhoras(n){ return (Math.round((n||0)*100)/100).toLocaleString("es-ES",{maximumFractionDigits:2}) + " h"; }
function fechaCorta(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function fechaLarga(iso){
  const d = new Date(iso+"T00:00:00");
  const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  return `${dias[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

/* Diferencia horaria (admite turnos que cruzan medianoche) */
function horasEntre(entrada,salida,descansoMin=0){
  if(!entrada||!salida) return 0;
  const [h1,m1]=entrada.split(":").map(Number), [h2,m2]=salida.split(":").map(Number);
  let min = (h2*60+m2)-(h1*60+m1);
  if(min<0) min+=24*60;            // cruza medianoche
  min -= num(descansoMin);
  return Math.max(0,min/60);
}
function redondear(h){
  const r = state?.config?.redondeoMin || 0;
  if(!r) return h;
  const paso = r/60;
  return Math.round(h/paso)*paso;
}

/* ============================================================
   CAPA DB — localStorage (sustituible por Supabase/Firebase)
   ============================================================ */
const DB = {
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ console.error("Error leyendo datos",e); return null; }
  },
  save(data){
    try{
      data.meta = {version:APP_VERSION, savedAt:new Date().toISOString()};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    }catch(e){ toast("No se pudo guardar (almacenamiento lleno)","err"); return false; }
  },
  wipe(){ localStorage.removeItem(STORAGE_KEY); }
};

/* ---------- Datos de ejemplo (editables / borrables) ---------- */
function datosEjemplo(){
  // La app arranca VACÍA: solo existirá lo que tú crees. Ejemplos desactivados.
  state = { etts:[], hoteles:[], servicios:[], jornadas:[], pagos:[], config:configPorDefecto() };
  return state;
  /* (código de ejemplo antiguo — ya no se ejecuta) */
  const ett1=uid(), ett2=uid();
  const hot1=uid(), hot2=uid();
  const srv1=uid(), srv2=uid(), srv3=uid();
  const hoy = new Date();

/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */
/* Devuelve el conjunto de tarifas VIGENTE para una fecha concreta.
   Si el servicio tiene historial de periodos (subidas con fecha), elige el
   periodo cuyo 'desde' es el más reciente <= fecha. Si no hay historial,
   usa los campos actuales del servicio (compatibilidad hacia atrás). */
function snapshotTarifas(srv, fecha){
  const h = srv?.historialTarifas;
  if(!h || !h.length) return srv;
  let elegido = h[0]; // h se mantiene ordenado por 'desde' ascendente
  for(const snap of h){ if((snap.desde||"") <= (fecha||"")) elegido = snap; }
  return elegido;
}
/* Tarifa efectiva: tarifa vigente en la fecha + override por ETT si existe.
   Campos vacíos del override heredan la tarifa base de ese periodo. */
function tarifaEfectiva(srv, ettId, fecha){
  const snap = snapshotTarifas(srv, fecha || todayISO());
  const base = {
    tarifaNormal:num(snap?.tarifaNormal), tarifaNocturna:num(snap?.tarifaNocturna),
    tarifaFestiva:num(snap?.tarifaFestiva), tarifaExtra:num(snap?.tarifaExtra),
    plusTransporte:num(snap?.plusTransporte), plusDesplazamiento:num(snap?.plusDesplazamiento)
  };
  const ov = snap?.tarifasPorEtt?.[ettId];
  if(!ov) return base;
  const m = {...base};
  ["tarifaNormal","tarifaNocturna","tarifaFestiva","tarifaExtra","plusTransporte","plusDesplazamiento"]
    .forEach(k=>{ if(ov[k]!==undefined && ov[k]!=="" && ov[k]!==null) m[k]=num(ov[k]); });
  return m;
}
/* Deducciones efectivas de una ETT: sus % propios si los definió, o los globales
   como plantilla. Cada % vacío hereda el global. Marca 'propia' si la ETT tiene tabla. */
function deduccionesEtt(ettId){
  const g = state?.config||configPorDefecto();
  const base = {irpf:num(g.irpf),contingenciasComunes:num(g.contingenciasComunes),desempleo:num(g.desempleo),formacion:num(g.formacion),mei:num(g.mei)};
  const e = getEtt(ettId); const d = e && e.deducciones;
  if(!d) return {...base, propia:false};
  const pick=k=>(d[k]!==undefined && d[k]!=="" && d[k]!==null) ? num(d[k]) : base[k];
  return {irpf:pick("irpf"),contingenciasComunes:pick("contingenciasComunes"),desempleo:pick("desempleo"),formacion:pick("formacion"),mei:pick("mei"), propia:true};
}
function pctDeduccion(ded){ return (num(ded.irpf)+num(ded.contingenciasComunes)+num(ded.desempleo)+num(ded.formacion)+num(ded.mei))/100; }
function pctSSTrab(ded){ return (num(ded.contingenciasComunes)+num(ded.desempleo)+num(ded.formacion)+num(ded.mei)); }
/* Devengo por conceptos €/hora de la ETT (los del recibo real). Devuelve null si
   la ETT no tiene tabla de conceptos → se usa la tarifa por servicio de siempre. */
function devengoConceptos(ettId, horas){
  const e = getEtt(ettId); const cs = (e && e.conceptos) || [];
  if(!cs.length) return null;
  const lineas = cs.map(c=>({ nombre:c.nombre, valorHora:num(c.valor), cotiza:c.cotiza!==false, importe:+(num(horas)*num(c.valor)).toFixed(2) }));
  const bruto  = +(lineas.reduce((a,x)=>a+x.importe,0)).toFixed(2);
  const baseCot= +(lineas.filter(x=>x.cotiza).reduce((a,x)=>a+x.importe,0)).toFixed(2);
  return {lineas, bruto, baseCot};
}
function recalcular(j){
  const srv = getServicio(j.servicioId);
  // Horas: si no se desglosan, usar diferencia entrada/salida como horas normales
  let hn=num(j.horasNormales), hnoc=num(j.horasNocturnas), hfes=num(j.horasFestivas), hext=num(j.horasExtra);
  const totalDesglose = hn+hnoc+hfes+hext;
  // Suma de tramos: turno de mañana + turno de tarde (turno partido)
  const totalReloj = redondear(horasEntre(j.horaEntrada,j.horaSalida,j.descanso) + horasEntre(j.horaEntrada2,j.horaSalida2,j.descanso2));
  if(totalDesglose===0 && totalReloj>0){ hn = totalReloj; }
  // restar nocturnas/festivas/extra del bloque reloj cuando el usuario las especifica junto a entrada/salida
  else if(totalReloj>0 && (hnoc+hfes+hext)>0 && hn===0){
    hn = Math.max(0, totalReloj-(hnoc+hfes+hext));
  }
  j.horasNormales=hn; j.horasNocturnas=hnoc; j.horasFestivas=hfes; j.horasExtra=hext;
  j.horasTotales = +(hn+hnoc+hfes+hext).toFixed(2);
  j.horasPagables = j.horasTotales;

  // Tarifas efectivas según la ETT y la FECHA de la jornada (periodo vigente + override por ETT)
  const tar = tarifaEfectiva(srv, j.ettId, j.fecha);
  const tN=tar.tarifaNormal, tNo=tar.tarifaNocturna, tF=tar.tarifaFestiva, tE=tar.tarifaExtra;
  j.impNormales=+(hn*tN).toFixed(2);
  j.impNocturnas=+(hnoc*tNo).toFixed(2);
  j.impFestivas=+(hfes*tF).toFixed(2);
  j.impExtra=+(hext*tE).toFixed(2);
  j.tarifaAplicada=tN; // tarifa normal usada, para mostrar en la interfaz
  // Plus: usa lo de la jornada si existe, si no hereda de la tarifa efectiva
  const pT = num(j.plusTransporte)|| tar.plusTransporte;
  const pD = num(j.plusDesplazamiento)|| tar.plusDesplazamiento;
  j.plusTransporte=pT; j.plusDesplazamiento=pD;
  j.plusTotal=+(pT+pD).toFixed(2);

  const dietas=num(j.dietas), propinas=num(j.propinas);

  // Devengo: si la ETT tiene conceptos €/hora (recibo real) se usan esos; si no,
  // la tarifa por servicio de siempre. La base de cotización sólo suma lo cotizable.
  const dc = devengoConceptos(j.ettId, j.horasTotales);
  if(dc){
    j.devengoLineas  = dc.lineas;
    j.brutoEstimado  = +(dc.bruto + dietas + propinas).toFixed(2);
    j.baseCotizacion = dc.baseCot;
  } else {
    j.devengoLineas  = null;
    j.brutoEstimado  = +(j.impNormales+j.impNocturnas+j.impFestivas+j.impExtra+pT+pD+dietas+propinas).toFixed(2);
    j.baseCotizacion = Math.max(0, j.brutoEstimado - dietas - propinas);
  }

  // Deducciones: % propios de la ETT (o globales como plantilla), sobre la base de cotización.
  const ded = deduccionesEtt(j.ettId);
  j.deduccionesPct = pctDeduccion(ded);
  j.deducciones    = +(j.baseCotizacion * j.deduccionesPct).toFixed(2);
  j.netoEstimado   = +(j.brutoEstimado - j.deducciones).toFixed(2);
  j.updatedAt=new Date().toISOString();
  return j;
}

/* ============================================================
   CHEQUEO DE COHERENCIA — detecta jornadas raras
   Devuelve [{n:'error'|'warn', t:'texto'}]
   ============================================================ */
function problemasJornada(j){
  const p=[]; const srv=getServicio(j.servicioId);
  if(j.horaEntrada && j.horaSalida){
    const [h1,m1]=j.horaEntrada.split(":").map(Number), [h2,m2]=j.horaSalida.split(":").map(Number);
    if((h2*60+m2)<(h1*60+m1)) p.push({n:"warn",t:"La salida es anterior a la entrada (se cuenta como turno que cruza medianoche)."});
    const reloj=horasEntre(j.horaEntrada,j.horaSalida,j.descanso);
    if(reloj<=0 && num(j.descanso)>0) p.push({n:"warn",t:"El descanso es igual o mayor que la duración del turno."});
  }
  if(num(j.horasTotales)<=0) p.push({n:"error",t:"La jornada no tiene horas (revisa entrada/salida o el desglose)."});
  if(num(j.horasTotales)>16) p.push({n:"warn",t:`Jornada muy larga: ${fhoras(j.horasTotales)}. ¿Es correcto?`});
  if(!j.servicioId || !srv) p.push({n:"error",t:"Sin servicio asignado."});
  else {
    const tar=tarifaEfectiva(srv,j.ettId,j.fecha);
    if(num(tar.tarifaNormal)===0 && num(j.horasTotales)>0) p.push({n:"error",t:"El servicio no tiene tarifa para esta fecha/ETT: el importe sale a 0."});
  }
  if(!j.ettId) p.push({n:"warn",t:"Sin ETT asignada."});
  return p;
}
function tieneErrorJornada(j){ return problemasJornada(j).some(x=>x.n==="error"); }

function sumar(arr,campo){ return arr.reduce((a,j)=>a+num(j[campo]),0); }
function resumenPeriodo(jornadas){
  return {
    horas:sumar(jornadas,"horasTotales"),
    bruto:sumar(jornadas,"brutoEstimado"),
    neto:sumar(jornadas,"netoEstimado"),
    hn:sumar(jornadas,"horasNormales"), hnoc:sumar(jornadas,"horasNocturnas"),
    hfes:sumar(jornadas,"horasFestivas"), hext:sumar(jornadas,"horasExtra"),
    n:jornadas.length,
  };
}
function contarAlertas(){
  if(!state) return 0;
  let n=0;
  const mes=state.jornadas.filter(j=>mismoMes(j.fecha,nominaRef));
  n+=mes.filter(j=>!esCobrada(j)&&esConfirmada(j)).length>0?1:0;
  n+=state.jornadas.filter(j=>j.estadoJornada==="Pendiente de validar").length>0?1:0;
  n+=state.jornadas.filter(j=>{const s=getServicio(j.servicioId);return !s||num(s.tarifaNormal)===0;}).length>0?1:0;
  n+=state.jornadas.filter(j=>j.incidencia).length>0?1:0;
  return n;
}

  const jMesConf=state.jornadas.filter(j=>mismoMes(j.fecha)&&esConfirmada(j));
  const rMes=resumenPeriodo(jMesConf);
  const proximos=state.jornadas.filter(j=>esPlaneada(j)&&new Date(j.fecha)>=new Date(hoy))
                  .sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,3);

  // Agrupar por ETT (mes)
  const porEtt={};
  jMesConf.forEach(j=>{const k=j.ettId||"x";(porEtt[k]=porEtt[k]||[]).push(j);});

  let html=`
  <section class="hero">

    <div class="big">${fhoras(rHoy.horas)}</div>
    <div class="sub">Estimado a cobrar hoy: ${money(rHoy.bruto)} · Neto ${money(rHoy.neto)}</div>

  <div class="fab-quick">

    <button class="btn accent" data-quick="pago"><span class="ic">💶</span>Registrar pago</button>
  </div>`;

  // Onboarding cuando aún no hay catálogos
  if(!state.etts.length || !state.servicios.length){
    html+=`<div class="card" style="border-color:var(--brand);margin-top:14px">
      <div style="font-weight:850;font-size:16px">👋 Empieza en 3 pasos</div>
      <div class="muted small" style="margin:4px 0 12px">Configura lo tuyo una vez. Luego registrar una jornada es cuestión de segundos.</div>
      <button class="btn primary" data-onb="ett" style="margin-bottom:8px">1 · Crear tu ETT / empresa</button>
      <button class="btn" data-onb="hotel" style="margin-bottom:8px">2 · Crear hotel / cliente</button>
      <button class="btn" data-onb="servicio">3 · Crear servicio (con el nombre que uses)</button>
    </div>`;
  }

  // Alertas
  const alertas=construirAlertas();
  if(alertas.length){
    html+=`<div class="section-title">Avisos</div>`;
    html+=alertas.map(a=>`<div class="alert ${a.tipo}"><span class="ic">${a.ic}</span><div>${a.txt}</div></div>`).join("");
  }

  // Revisar esto: jornadas con incoherencias detectadas
  const revisar=state.jornadas.filter(j=>problemasJornada(j).length)
                  .sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(revisar.length){
    html+=`<div class="section-title">⚠️ Revisar esto (${revisar.length})</div>`;
    html+=revisar.slice(0,8).map(j=>{
      const probs=problemasJornada(j);
      const hayErr=probs.some(x=>x.n==="error");
      return `<div class="j-card" data-jornada="${j.id}"><div class="bar" style="background:${hayErr?'var(--danger)':'var(--warn)'}"></div>
        <div class="body"><div class="ett">${escapeHtml(nombreServicio(j))} <span class="muted small" style="font-weight:600">· ${fechaCorta(j.fecha)} · ${escapeHtml(nombreEtt(j))}</span></div>
        <div class="meta" style="color:${hayErr?'#ff9caf':'#ffce80'}">${probs.map(x=>escapeHtml(x.t)).join(" · ")}</div></div>
        <div class="nums"><div class="bruto">${money(j.brutoEstimado)}</div></div></div>`;
    }).join("");
  }

  // KPIs semana / mes
  html+=`<div class="section-title">Resumen</div>
  <div class="grid2">
    <div class="kpi"><div class="k-label">Semana confirmada</div><div class="k-val">${fhoras(resumenPeriodo(jSemConf).horas)}</div><div class="small muted">${money(resumenPeriodo(jSemConf).bruto)}</div></div>
    <div class="kpi"><div class="k-label">Semana planeada</div><div class="k-val">${fhoras(resumenPeriodo(jSemPlan).horas)}</div><div class="small muted">${money(resumenPeriodo(jSemPlan).bruto)}</div></div>
    <div class="kpi"><div class="k-label">Mes confirmado</div><div class="k-val">${fhoras(rMes.horas)}</div><div class="small muted">${money(rMes.bruto)} bruto</div></div>
    <div class="kpi"><div class="k-label">Neto estimado mes</div><div class="k-val" style="color:var(--accent)">${money(rMes.neto)}</div><div class="small muted">${rMes.n} jornadas</div></div>
  </div>`;

  // Jornadas de hoy
  html+=`<div class="section-title">Hoy</div>`;
  html+= jHoy.length? jHoy.map(tarjetaJornada).join("")
        : `<div class="card"><div class="muted small">No hay jornadas registradas hoy. Pulsa <b>Registrar jornada</b>.</div></div>`;

  // Próximos turnos
  if(proximos.length){
    html+=`<div class="section-title">Próximos turnos planeados</div>`;
    html+=proximos.map(j=>tarjetaJornada(j,true)).join("");
  }

  // Tarjetas por ETT
  const claves=Object.keys(porEtt);
  if(claves.length){
    html+=`<div class="section-title">Por ETT · este mes</div>`;
    html+=claves.map(k=>{
      const arr=porEtt[k]; const e=getEtt(k); const r=resumenPeriodo(arr);
      const pend=arr.filter(j=>!esCobrada(j)).length;
      return `<div class="j-card"><div class="bar" style="background:${e?.color||'#5b8cff'}"></div>
        <div class="body"><div class="ett"><span class="pill-color" style="background:${e?.color||'#5b8cff'}"></span>${escapeHtml(e?.nombre||'Sin ETT')}</div>
        <div class="meta">${arr.length} jornadas · ${fhoras(r.horas)} · ${pend} sin cobrar</div></div>
        <div class="nums"><div class="bruto">${money(r.bruto)}</div><div class="neto">neto ${money(r.neto)}</div></div></div>`;
    }).join("");
  }
  return html;
}

function construirAlertas(){
  const a=[];
  const mes=state.jornadas.filter(j=>mismoMes(j.fecha));
  const pendCobro=mes.filter(j=>!esCobrada(j)&&esConfirmada(j));
  if(pendCobro.length) a.push({tipo:"warn",ic:"💰",txt:`Este mes tienes <b>${pendCobro.length}</b> jornada(s) confirmadas pendientes de cobro (${money(sumar(pendCobro,'brutoEstimado'))}).`});
  const sinValidar=state.jornadas.filter(j=>j.estadoJornada==="Pendiente de validar");
  if(sinValidar.length) a.push({tipo:"info",ic:"🕓",txt:`Tienes <b>${sinValidar.length}</b> turno(s) pendientes de validar.`});
  const sinTarifa=state.jornadas.filter(j=>{const s=getServicio(j.servicioId);return !s||num(s.tarifaNormal)===0;});
  if(sinTarifa.length) a.push({tipo:"danger",ic:"⚠️",txt:`Hay <b>${sinTarifa.length}</b> jornada(s) con servicio sin tarifa configurada.`});
  const conInc=state.jornadas.filter(j=>j.incidencia);
  if(conInc.length) a.push({tipo:"danger",ic:"🚩",txt:`<b>${conInc.length}</b> jornada(s) con incidencia abierta.`});
  // Diferencia registrado vs cobrado del mes
  const dif=diferenciaMes(nominaRef);
  if(Math.abs(dif)>0.5){
    const t = dif>0 ? `Faltan por cobrar aprox. <b>${money(dif)}</b> respecto a lo registrado este mes.`
                    : `Has cobrado <b>${money(-dif)}</b> más de lo registrado este mes (revisa o registra jornadas).`;
    a.push({tipo: dif>0?"warn":"ok", ic:"📊", txt:t});
  }
  return a;
}
function diferenciaMes(ref){
  const mes=state.jornadas.filter(j=>mismoMes(j.fecha,ref)&&esConfirmada(j));
  const brutoConf=sumar(mes,"brutoEstimado");
  const cobrado=sumar(state.pagos.filter(p=>p.mesCorrespondiente===mesClave(ref)),"importeCobrado");
  return +(brutoConf-cobrado).toFixed(2);
}
function mesClave(ref){ return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,"0")}`; }

/* Tarjeta de jornada reutilizable */

function calendarioMes(){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const primero=new Date(y,m,1); const offset=(primero.getDay()+6)%7;
  const diasMes=new Date(y,m+1,0).getDate();
  let cells="";
  for(let i=0;i<offset;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=diasMes;d++){
    const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const js=state.jornadas.filter(j=>j.fecha===iso);
    const bruto=sumar(js,"brutoEstimado");
    const dots=js.slice(0,4).map(j=>`<span class="dot" style="background:${colorJornada(j)}"></span>`).join("");
    const hoy=iso===todayISO()?"today":"";
    const sel=iso===calSel?"sel":"";
    cells+=`<div class="cal-day ${hoy} ${sel}" data-dia="${iso}">
      <div class="num">${d}</div>
      ${js.length?`<div class="euro">${Math.round(bruto)}€</div>`:""}
      <div class="dots">${dots}</div>
    </div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <button class="icon-btn" data-calnav="-1">‹</button>
      <b>${MESES[m]} ${y}</b>
      <button class="icon-btn" data-calnav="1">›</button>
    </div>
    <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")}</div>
    <div class="cal-grid" style="margin-top:5px">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--info)"></i>Planeado</span>
      <span><i style="background:var(--ok)"></i>Confirmado</span>
      <span><i style="background:var(--brand)"></i>Cobrado</span>
      <span><i style="background:var(--danger)"></i>Incidencia</span>
    </div>
  </div>
  ${detalleDia(calSel)}`;
}
function calendarioSemana(){
  const ini=inicioSemana(calRef);
  let cards="";
  for(let i=0;i<7;i++){
    const dd=new Date(ini); dd.setDate(dd.getDate()+i);

    const js=state.jornadas.filter(j=>j.fecha===iso);

    cards+=`<div class="list-item" data-dia="${iso}" style="cursor:pointer">
      <div class="body"><div class="title">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"][i]} ${dd.getDate()}</div>

}

// Liquidación mensual de una ETT aplicando SUS complementos y descuentos propios.
function liquidacionEtt(ettId, ref){
  const e=getEtt(ettId); if(!e) return null;
  const mes=state.jornadas.filter(j=>j.ettId===ettId && mismoMes(j.fecha,ref) && esConfirmada(j));
  const bruto=sumar(mes,"brutoEstimado");
  const calc=c=>({ ...c, importe: c.tipo==="pct" ? +(bruto*num(c.valor)/100).toFixed(2) : num(c.valor) });
  const comp=(e.complementos||[]).map(calc);
  const desc=(e.descuentos||[]).map(calc);
  const sumComp=comp.reduce((a,x)=>a+x.importe,0);
  const sumDesc=desc.reduce((a,x)=>a+x.importe,0);
  return { bruto, comp, desc, sumComp, sumDesc, neto:+(bruto+sumComp-sumDesc).toFixed(2), tiene:(comp.length+desc.length)>0 };
}
/* Etiquetas de fecha para la vista semanal */
function rangoFechas(a,b){
  const da=new Date(a+"T00:00:00"), db=new Date(b+"T00:00:00");
  const mA=MESES[da.getMonth()].slice(0,3).toLowerCase(), mB=MESES[db.getMonth()].slice(0,3).toLowerCase();
  if(a===b) return `${da.getDate()} ${mA}`;
  if(da.getMonth()===db.getMonth()) return `Del ${da.getDate()} al ${db.getDate()} ${mB}`;
  return `Del ${da.getDate()} ${mA} al ${db.getDate()} ${mB}`;
}
function diaCortoLabel(iso){ const d=new Date(iso+"T00:00:00"); const dd=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"]; return `${dd[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}`; }
/* Estado de cobro agregado de un grupo de jornadas (semana/contrato). */
function estadoCobroGrupo(dias){
  const cob=dias.filter(esCobrada).length;
  if(cob===0) return "Pendiente de cobro";
  if(cob>=dias.length) return "Cobrada";
  return "Parcialmente cobrada";
}
/* Liquidación de una ETT desglosada por SEMANA/CONTRATO (híbrido: si la jornada tiene
   referencia de contrato agrupa por ella; si no, por semana natural). */
function liquidacionSemanalEtt(ettId, ref){
  const e=getEtt(ettId);
  const mes=state.jornadas.filter(j=>j.ettId===ettId && mismoMes(j.fecha,ref) && esConfirmada(j));
  const grupos={};
  mes.forEach(j=>{
    const cref=(j.contratoRef||"").trim();
    const k = cref ? "c:"+cref : "w:"+inicioSemana(j.fecha+"T00:00:00").toISOString().slice(0,10);
    (grupos[k]=grupos[k]||{dias:[],label:cref||null}).dias.push(j);
  });
  const ded=deduccionesEtt(ettId); const pct=pctDeduccion(ded);
  const bloques=Object.values(grupos).map(g=>{
    const dias=g.dias.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const horas=sumar(dias,"horasTotales"), bruto=sumar(dias,"brutoEstimado"), base=sumar(dias,"baseCotizacion");
    const deduc=+(base*pct).toFixed(2), neto=+(bruto-deduc).toFixed(2);
    return {label:g.label, fIni:dias[0].fecha, fFin:dias[dias.length-1].fecha, dias, ids:dias.map(x=>x.id),
            horas, bruto, base, deduc, neto, estadoCobro:estadoCobroGrupo(dias)};
  }).sort((a,b)=>a.fIni.localeCompare(b.fIni));
  const tot={horas:sumar(mes,"horasTotales"), bruto:sumar(mes,"brutoEstimado"), base:sumar(mes,"baseCotizacion")};
  tot.deduc=+(tot.base*pct).toFixed(2); tot.neto=+(tot.bruto-tot.deduc).toFixed(2);
  tot.cobrado=sumar(mes.filter(esCobrada),"brutoEstimado"); tot.pendiente=+(tot.bruto-tot.cobrado).toFixed(2);
  return {e, ded, pct, bloques, tot, nJornadas:mes.length};
}
function resumenAgrupado(jornadas,keyFn,nameFn,colorFn,ref){
  const g={};
  jornadas.forEach(j=>{const k=keyFn(j)||"x";(g[k]=g[k]||[]).push(j);});
  const keys=Object.keys(g);
  if(!keys.length) return `<div class="card"><div class="muted small">Sin datos.</div></div>`;
  return `<div class="card">`+keys.map(k=>{
    const arr=g[k]; const r=resumenPeriodo(arr);
    const cobrado = ref? sumar(state.pagos.filter(p=>p.ettId===k&&p.mesCorrespondiente===mesClave(ref)),"importeCobrado"):null;
    const pend = arr.filter(j=>!esCobrada(j)).length;
    return `<div class="tline"><span><span class="pill-color" style="background:${colorFn(k)||'#5b8cff'};vertical-align:middle"></span> ${escapeHtml(nameFn(k)||'—')} <span class="muted small">(${arr.length})</span></span>
      <span style="text-align:right"><b>${money(r.bruto)}</b><br><span class="small muted">${fhoras(r.horas)}${pend?` · ${pend} sin cobrar`:''}</span></span></div>`;
  }).join("")+`</div>`;
}

  <details class="acc"><summary>Estado y referencias <span class="arrow">▾</span></summary><div class="acc-body">

      <div class="field"><label>Estado jornada</label><select class="input" id="jEstadoJ">${ESTADOS_JORNADA.map(e=>`<option ${j.estadoJornada===e?'selected':''}>${e}</option>`).join("")}</select></div>
      <div class="field"><label>Estado cobro</label><select class="input" id="jEstadoC">${ESTADOS_COBRO.map(e=>`<option ${j.estadoCobro===e?'selected':''}>${e}</option>`).join("")}</select></div>
    </div>

  <div class="btn-row" style="margin-top:6px">

  </div>`;
  abrirModal(editar?"Editar jornada":"Nueva jornada", html);

  // Auto-seleccionar hotel/ETT al cambiar servicio
  const autoServicio=()=>{
    const s=getServicio($("#jServicio").value);
    if(s){ if(s.ettId)$("#jEtt").value=s.ettId; if(s.hotelId)$("#jHotel").value=s.hotelId;
      if(s.responsable && !$("#jContacto").value) $("#jContacto").value=s.responsable; }
    previewCalc();
  };
  $("#jServicio").onchange=autoServicio;
  // Crear servicio al vuelo: abre el alta y vuelve al registro con él preseleccionado
  $("#jNewServicio").onclick=()=>abrirFormServicio(null,{volverJornada:{fecha:$("#jFecha").value}});
  $("#jEtt").onchange=previewCalc;   // al cambiar de ETT, se aplica su tarifa
  ["jEntrada","jSalida","jDescanso","jEntrada2","jSalida2","jDescanso2"].forEach(id=>$("#"+id).oninput=previewCalc);
  $$(".jh").forEach(i=>i.oninput=previewCalc);
  previewCalc();

  function leerForm(){
    return {
      fecha:$("#jFecha").value, ettId:$("#jEtt").value||null, hotelId:$("#jHotel").value||null,
      servicioId:$("#jServicio").value||null, horaEntrada:$("#jEntrada").value, horaSalida:$("#jSalida").value,
      descanso:num($("#jDescanso").value),
      horaEntrada2:$("#jEntrada2").value, horaSalida2:$("#jSalida2").value, descanso2:num($("#jDescanso2").value),
      horasNormales:num($("#jHN").value), horasNocturnas:num($("#jHNoc").value),
      horasFestivas:num($("#jHFes").value), horasExtra:num($("#jHExt").value),
      plusTransporte:num($("#jPT").value), plusDesplazamiento:num($("#jPD").value),
      dietas:num($("#jDietas").value), propinas:num($("#jPropinas").value),
      estadoJornada:$("#jEstadoJ").value, estadoCobro:$("#jEstadoC").value, estadoParte:$("#jEstadoP").value,
      contacto:$("#jContacto").value, referencia:$("#jRef").value, contratoRef:$("#jContrato").value.trim(), observaciones:$("#jObs").value,
    };
  }
  function previewCalc(){
    const tmp=recalcular(Object.assign({},j,leerForm()));
    const nomEtt=getEtt(tmp.ettId)?.nombre;
    const probs=problemasJornada(tmp);
    const aviso = probs.length? `<div class="small" style="color:#ff9caf;margin-top:7px;font-weight:700">⚠ ${probs.map(p=>escapeHtml(p.t)).join(" · ")}</div>` : "";
    $("#calcPreview").innerHTML=`<span class="ic">⚡</span><div>
      <b>${fhoras(tmp.horasTotales)}</b> · Bruto <b>${money(tmp.brutoEstimado)}</b> · Neto <b>${money(tmp.netoEstimado)}</b>
      <br><span class="small">Tarifa aplicada <b>${money(tmp.tarifaAplicada||0)}/h</b>${nomEtt?` (${escapeHtml(nomEtt)})`:''} · Noct ${money(tmp.impNocturnas)} · Fest ${money(tmp.impFestivas)} · Extra ${money(tmp.impExtra)} · Plus ${money(tmp.plusTotal)}</span>${aviso}</div>`;
  }
  $("#jGuardar").onclick=()=>{
    const datos=leerForm();
    if(!datos.fecha){toast("Falta la fecha","err");$("#jFecha").classList.add("err");return;}
    if(!datos.servicioId){toast("Selecciona un servicio","err");$("#jServicio").classList.add("err");return;}
    Object.assign(j,datos); recalcular(j);
    const probs=problemasJornada(j);
    if(editar){ const i=state.jornadas.findIndex(x=>x.id===j.id); state.jornadas[i]=j; }
    else state.jornadas.push(j);
    guardar(); cerrarModal();
    if(probs.length) toast(`Guardada con ${probs.length} aviso(s) — revísala en Inicio`,"err");
    else toast(editar?"Jornada actualizada":"Jornada guardada ✓","ok");
    render();
  };
  if(editar){
    $("#jBorrar").onclick=()=>confirmar("¿Eliminar esta jornada?",()=>{
      state.jornadas=state.jornadas.filter(x=>x.id!==j.id); guardar(); cerrarModal(); toast("Jornada eliminada"); render();
    });
  }else{
    $("#jDuplicarUlt").onclick=()=>{
      const ult=[...state.jornadas].sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];
      if(!ult){toast("No hay jornada anterior","err");return;}
      ["jEtt","jHotel","jServicio","jEntrada","jSalida"].forEach((id,i)=>{
        const campos=["ettId","hotelId","servicioId","horaEntrada","horaSalida"];
        $("#"+id).value=ult[campos[i]]||"";
      });
      $("#jDescanso").value=ult.descanso||0; previewCalc(); toast("Cargado desde la anterior");
    };
  }
}
function selOpts(arr,sel){
  return `<option value="">—</option>`+arr.filter(x=>x.activa!==false&&x.activo!==false)
    .map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${escapeHtml(x.nombre)}</option>`).join("");
}

/* ---- Formulario PAGO ---- */
function abrirFormPago(){
  const html=`
  <div class="field"><label>Importe cobrado *</label><input type="number" step="0.01" class="input" id="pImporte" placeholder="0,00"></div>
  <div class="grid2">
    <div class="field"><label>Fecha de pago</label><input type="date" class="input" id="pFecha" value="${todayISO()}"></div>
    <div class="field"><label>Mes correspondiente</label><input type="month" class="input" id="pMes" value="${mesClave(nominaRef)}"></div>
  </div>
  <div class="field"><label>Empresa que pagó</label><select class="input" id="pEtt">${selOpts(state.etts,null)}</select></div>
  <div class="field"><label>Concepto</label><input class="input" id="pConcepto" placeholder="Nómina, anticipo, extra…" value="Nómina"></div>
  <div class="field"><label>Observaciones</label><textarea class="input" id="pObs"></textarea></div>
  <button class="btn accent" id="pGuardar">Guardar pago</button>`;
  abrirModal("Registrar pago recibido", html);
  $("#pGuardar").onclick=()=>{
    const imp=num($("#pImporte").value);
    if(imp<=0){toast("Indica un importe","err");$("#pImporte").classList.add("err");return;}
    const mes=$("#pMes").value;
    const ettId=$("#pEtt").value||null;
    const brutoMes=sumar(state.jornadas.filter(j=>j.ettId===ettId&&j.fecha.startsWith(mes)&&esConfirmada(j)),"brutoEstimado");
    state.pagos.push({
      id:uid(), fechaPago:$("#pFecha").value, ettId, mesCorrespondiente:mes,
      importeCobrado:imp, concepto:$("#pConcepto").value, jornadasAsociadas:[],
      diferencia:+(brutoMes-imp).toFixed(2), observaciones:$("#pObs").value, createdAt:new Date().toISOString(),
    });
    guardar(); cerrarModal(); toast("Pago registrado ✓","ok"); render();
  };
}

// Fila editable de un concepto (complemento o descuento) de una ETT

    <select class="input cn-tipo" style="flex:0 0 64px"><option value="eur" ${c.tipo!=='pct'?'selected':''}>€</option><option value="pct" ${c.tipo==='pct'?'selected':''}>%</option></select>
    <button type="button" class="btn ghost sm cn-del" style="flex:0 0 auto">🗑</button>
  </div>`;
}
// Fila editable de un concepto de devengo €/HORA (los del recibo: salario base, prorratas, pluses)

  </div>`;
}

function importarArchivo(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      if(file.name.endsWith(".json")){
        const data=JSON.parse(e.target.result);
        if(!data.jornadas){toast("Archivo no válido","err");return;}
        confirmar("¿Reemplazar TODOS los datos con este backup?",()=>{
          state=Object.assign(datosEjemplo(),data);
          state.config=Object.assign(configPorDefecto(),data.config||{});
          recalcularTodo();aplicarTema();toast("Datos restaurados ✓","ok");render();
        });
      }else if(file.name.endsWith(".csv")){
        toast("CSV detectado: usa JSON para restaurar completo","err");
      }
    }catch(err){toast("Error al leer el archivo","err");}
  };
  reader.readAsText(file);
}

/* ============================================================
   NUBE — Sincronización con Supabase (gratis)
   Auth por CÓDIGO de email (OTP), sin redirecciones.
   La tabla 'horasapp_data' guarda 1 fila por usuario con todo el estado.
   ============================================================ */
async function cargarSupabase(){
  const url=state.config.supabaseUrl, key=state.config.supabaseKey;
  if(!url||!key) throw new Error("Configura la URL y la clave de Supabase");
  if(window._sb) return window._sb;
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.45.4");
  window._sb = createClient(url, key, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"horasapp_sb_auth" } });
  return window._sb;
}
async function nubeUsuario(){
  const sb=await cargarSupabase();
  const { data } = await sb.auth.getUser();
  return data?.user||null;
}
// Entrar con email + contraseña. Si la cuenta no existe, la crea automáticamente.
async function nubeEntrar(email, password){
  if(!email||!password){toast("Escribe email y contraseña","err");return;}
  if(password.length<6){toast("La contraseña debe tener al menos 6 caracteres","err");return;}
  try{
    const sb=await cargarSupabase();
    let { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      // No existe o credenciales: intentamos crear la cuenta
      const r = await sb.auth.signUp({ email, password });
      if(r.error) throw r.error;
      if(!r.data.session){
        toast("Cuenta creada. Confirma el email que te llegó y vuelve a pulsar Entrar.","ok");
        await refrescarEstadoNube(); return;
      }
    }
    toast("Conectada a la nube ✓","ok");
    await refrescarEstadoNube();
    nubeBajar();   // ofrece traer lo que haya en la nube
  }catch(e){ toast("Error: "+(e.message||e),"err"); }
}
async function nubeSubir(silencioso=false){
  const sb=await cargarSupabase();
  const u=await nubeUsuario();
  if(!u){ if(!silencioso)toast("Primero entra con tu email","err"); return; }
  const { error } = await sb.from("horasapp_data").upsert({ user_id:u.id, data:state, updated_at:new Date().toISOString() });
  if(error){ if(!silencioso)toast("Error al subir: "+error.message,"err"); return; }
  if(!silencioso) toast("Datos subidos a la nube ⬆","ok");
}
async function nubeBajar(){
  const sb=await cargarSupabase();
  const u=await nubeUsuario();
  if(!u){ toast("Primero entra con tu email","err"); return; }
  const { data, error } = await sb.from("horasapp_data").select("data,updated_at").eq("user_id",u.id).maybeSingle();
  if(error){ toast("Error al bajar: "+error.message,"err"); return; }
  if(!data||!data.data){ toast("La nube está vacía: sube tus datos primero","err"); return; }
  confirmar("¿Reemplazar los datos de este dispositivo con los de la nube?",()=>{
    const cfgLocal=state.config;                  // conservar config local (claves, tema)
    state=Object.assign(datosEjemplo(),data.data);
    state.config=Object.assign(configPorDefecto(), data.data.config||{}, {
      supabaseUrl:cfgLocal.supabaseUrl, supabaseKey:cfgLocal.supabaseKey, syncAuto:cfgLocal.syncAuto
    });
    recalcularTodo(); aplicarTema(); toast("Datos de la nube cargados ✓","ok"); render();
  });
}
async function nubeCerrarSesion(){
  try{
    const sb=await cargarSupabase();
    await sb.auth.signOut();
    toast("Sesión cerrada en este dispositivo","ok");
    await refrescarEstadoNube();
  }catch(e){ toast("Error: "+(e.message||e),"err"); }
}
// Sincronización automática al abrir: si la nube es más nueva, la trae; si lo local es más nuevo, lo sube.
async function sincronizarInicio(origSaved){
  try{
    clearTimeout(_syncT);   // cancela subidas pendientes para no pisar la nube con datos viejos
    if(!state.config.supabaseUrl||!state.config.supabaseKey) return;
    const sb=await cargarSupabase();
    const u=await nubeUsuario();
    if(!u) return; // sin sesión: se conectará al iniciar sesión
    const meta=await sb.from("horasapp_data").select("updated_at").eq("user_id",u.id).maybeSingle();
    const cloudT=meta.data?.updated_at ? Date.parse(meta.data.updated_at) : 0;
    const localT=origSaved ? Date.parse(origSaved) : 0;   // hora REAL del último guardado local (antes del auto-confirmar)
    if(cloudT > localT + 1000){
      // La nube es más nueva: traerla, aplicar auto-confirmar sobre datos frescos y devolver el resultado a la nube
      const full=await sb.from("horasapp_data").select("data").eq("user_id",u.id).maybeSingle();
      const d=full.data?.data;
      if(d){
        const cfg=state.config;
        state.etts=d.etts||[]; state.hoteles=d.hoteles||[]; state.servicios=d.servicios||[];
        state.jornadas=d.jornadas||[]; state.pagos=d.pagos||[];
        state.config=Object.assign(configPorDefecto(), d.config||{}, {supabaseUrl:cfg.supabaseUrl,supabaseKey:cfg.supabaseKey,syncAuto:cfg.syncAuto});
        state.jornadas.forEach(recalcular);
        autoConfirmarPlaneadas();
        DB.save(state);
        await nubeSubir(true);
        aplicarTema(); render();
        toast("Datos al día desde la nube ☁️","ok");
        return;
      }
    }
    // Lo local es lo más nuevo: subir (incluye el auto-confirmar de arranque)
    await nubeSubir(true);
  }catch(e){ /* silencioso: sin conexión, etc. */ }
}
async function refrescarEstadoNube(){
  const el=$("#nubeEstado"); if(!el) return;
  if(!state.config.supabaseUrl||!state.config.supabaseKey){
    el.className="alert info"; el.innerHTML='<span class="ic">☁️</span><div>Pega tu URL y clave de Supabase para empezar (ver guía NUBE.md).</div>'; return;
  }
  try{
    const u=await nubeUsuario();
    if(u){ el.className="alert ok"; el.innerHTML=`<span class="ic">✅</span><div>Conectada como <b>${escapeHtml(u.email||'')}</b>. Tus datos se sincronizan.</div>`; }
    else { el.className="alert warn"; el.innerHTML='<span class="ic">🔑</span><div>Configurada pero sin sesión. Entra con tu email abajo.</div>'; }
  }catch(e){ el.className="alert danger"; el.innerHTML=`<span class="ic">⚠️</span><div>No se pudo conectar: ${escapeHtml(e.message||String(e))}</div>`; }
}

/* ============================================================
   TEMA
   ============================================================ */
function aplicarTema(){
  document.documentElement.setAttribute("data-tema", state.config.tema==="claro"?"claro":"oscuro");
  $('meta[name=theme-color]').setAttribute("content", state.config.tema==="claro"?"#eef1f7":"#0a0e1a");
}
function toggleTema(){ state.config.tema = state.config.tema==="claro"?"oscuro":"claro"; guardar(); aplicarTema(); render(); }

/* ============================================================
   CONEXIÓN DE EVENTOS (delegación tras cada render)
   ============================================================ */
function conectarEventos(){
  // Onboarding (3 pasos)
  $$("[data-onb]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.onb;
    if(t==="ett") abrirFormEtt(); else if(t==="hotel") abrirFormHotel(); else abrirFormServicio();
  });
  // Botones rápidos
  $$("[data-quick]").forEach(b=>b.onclick=()=>{
    const q=b.dataset.quick;
    if(q==="jornada") abrirFormJornada();
    else if(q==="turno") abrirFormJornada(null,todayISO()); // planear (cambia estado en el form)
    else if(q==="pago") abrirFormPago();
  });
  // Tarjetas jornada -> editar
  $$("[data-jornada]").forEach(c=>c.onclick=e=>{
    if(e.target.closest("button"))return;
    const j=state.jornadas.find(x=>x.id===c.dataset.jornada); if(j)abrirFormJornada(j);
  });
  $$("[data-edit]").forEach(b=>b.onclick=e=>{e.stopPropagation();const j=state.jornadas.find(x=>x.id===b.dataset.edit);abrirFormJornada(j);});
  $$("[data-validar]").forEach(b=>b.onclick=e=>{e.stopPropagation();const j=state.jornadas.find(x=>x.id===b.dataset.validar);j.estadoJornada="Confirmada";guardar();toast("Turno validado ✓","ok");render();});
  $$("[data-cobrar]").forEach(b=>b.onclick=e=>{e.stopPropagation();const j=state.jornadas.find(x=>x.id===b.dataset.cobrar);j.estadoCobro="Cobrada";guardar();toast("Marcado como cobrado 💶","ok");render();});
  $$("[data-incidencia]").forEach(b=>b.onclick=e=>{e.stopPropagation();const j=state.jornadas.find(x=>x.id===b.dataset.incidencia);abrirIncidencia(j);});

  // Calendario
  $$("[data-calvista]").forEach(b=>b.onclick=()=>{calVista=b.dataset.calvista;render();});
  $$("[data-calnav]").forEach(b=>b.onclick=()=>{const d=+b.dataset.calnav; if(Math.abs(d)>=7){calRef.setDate(calRef.getDate()+d);}else{calRef.setMonth(calRef.getMonth()+d);} render();});
  $$("[data-dia]").forEach(c=>c.onclick=()=>{calSel=c.dataset.dia; if(calVista!=="dia")render(); else render();});
  $$("[data-dianav]").forEach(b=>b.onclick=()=>{const d=new Date(calSel+"T00:00:00");d.setDate(d.getDate()+ +b.dataset.dianav);calSel=d.toISOString().slice(0,10);render();});
  $$("[data-nuevo-en]").forEach(b=>b.onclick=()=>abrirFormJornada(null,b.dataset.nuevoEn));

  // Nómina
  $$("[data-cobrar-grupo]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const ids=(b.dataset.cobrarGrupo||"").split(",").filter(Boolean);
    ids.forEach(id=>{const j=state.jornadas.find(x=>x.id===id); if(j) j.estadoCobro="Cobrada";});
    guardar();toast(`Liquidación marcada como cobrada 💶 (${ids.length} día/s)`,"ok");render();});
  $$("[data-nomnav]").forEach(b=>b.onclick=()=>{nominaRef.setMonth(nominaRef.getMonth()+ +b.dataset.nomnav);render();});
  $$("[data-delpago]").forEach(b=>b.onclick=()=>confirmar("¿Eliminar este pago?",()=>{state.pagos=state.pagos.filter(p=>p.id!==b.dataset.delpago);guardar();toast("Pago eliminado");render();}));

  // Historial: filtros
  const bind=(id,key,re=false)=>{const el=$("#"+id);if(el)el[re?'onchange':'oninput']=()=>{filtros[key]=el.value;render();if(re||id==='histQ')document.getElementById(id)?.focus();};};
  if($("#histQ")) $("#histQ").oninput=()=>{filtros.q=$("#histQ").value; const pos=$("#histQ").selectionStart; render(); const e=$("#histQ"); if(e){e.focus();e.setSelectionRange(pos,pos);}};
  ["fDesde:desde","fHasta:hasta"].forEach(p=>{const[id,k]=p.split(":");if($("#"+id))$("#"+id).onchange=()=>{filtros[k]=$("#"+id).value;render();};});
  if($("#fEtt"))$("#fEtt").onchange=()=>{filtros.ett=$("#fEtt").value;render();};
  if($("#fHotel"))$("#fHotel").onchange=()=>{filtros.hotel=$("#fHotel").value;render();};
  if($("#fServicio"))$("#fServicio").onchange=()=>{filtros.servicio=$("#fServicio").value;render();};
  if($("#fEstadoJ"))$("#fEstadoJ").onchange=()=>{filtros.estadoJornada=$("#fEstadoJ").value;render();};
  if($("#fEstadoC"))$("#fEstadoC").onchange=()=>{filtros.estadoCobro=$("#fEstadoC").value;render();};
  if($("#limpiarFiltros"))$("#limpiarFiltros").onclick=()=>{filtros={q:"",ett:"",hotel:"",servicio:"",estadoJornada:"",estadoCobro:"",desde:"",hasta:""};render();};

  // Export
  $$("[data-export]").forEach(b=>b.onclick=()=>{const t=b.dataset.export;if(t==="json")exportarJSON();else if(t==="csv")exportarCSV();else exportarPDF();});

  // Ajustes: catálogos
  if($("[data-newett]"))$("[data-newett]").onclick=()=>abrirFormEtt();
  if($("[data-newhotel]"))$("[data-newhotel]").onclick=()=>abrirFormHotel();
  if($("[data-newservicio]"))$("[data-newservicio]").onclick=()=>abrirFormServicio();
  $$("[data-editett]").forEach(b=>b.onclick=()=>abrirFormEtt(getEtt(b.dataset.editett)));
  $$("[data-edithotel]").forEach(b=>b.onclick=()=>abrirFormHotel(getHotel(b.dataset.edithotel)));
  $$("[data-editservicio]").forEach(b=>b.onclick=()=>abrirFormServicio(getServicio(b.dataset.editservicio)));

  // Config salarial / app
  $$(".cfg").forEach(el=>el.onchange=()=>{
    const k=el.dataset.cfg;
    state.config[k]= (el.type==="number")?num(el.value):el.value;
    recalcularTodo();
    if(k==="supabaseUrl"||k==="supabaseKey"){ window._sb=null; refrescarEstadoNube(); } // recrear cliente
    if(k==="moneda"||k==="redondeoMin")render();
  });
  if($("#swTema"))$("#swTema").onchange=toggleTema;

  // Nube (Supabase)
  if($("#nubeEstado")) refrescarEstadoNube();
  if($("#nubeEntrar"))$("#nubeEntrar").onclick=()=>nubeEntrar($("#nubeEmail").value.trim(),$("#nubePass").value);
  if($("#nubeSubir"))$("#nubeSubir").onclick=()=>nubeSubir().catch(e=>toast("Error: "+(e.message||e),"err"));
  if($("#nubeBajar"))$("#nubeBajar").onclick=()=>nubeBajar().catch(e=>toast("Error: "+(e.message||e),"err"));
  if($("#nubeAuto"))$("#nubeAuto").onchange=()=>{ state.config.syncAuto=$("#nubeAuto").checked; guardar(); toast(state.config.syncAuto?"Sincronización automática activada":"Sincronización automática desactivada"); };
  if($("#nubeSalir"))$("#nubeSalir").onclick=()=>nubeCerrarSesion().catch(e=>toast("Error: "+(e.message||e),"err"));
  if($("[data-onedrive]"))$("[data-onedrive]").onclick=()=>{ exportarJSON(); toast("Guarda el archivo en tu carpeta de OneDrive/Drive","ok"); };
  if($("[data-backup]"))$("[data-backup]").onclick=exportarJSON;
  if($("[data-restore]"))$("[data-restore]").onclick=()=>$("#fileRestore").click();
  if($("#fileRestore"))$("#fileRestore").onchange=e=>{if(e.target.files[0])importarArchivo(e.target.files[0]);};
  if($("[data-wipe]"))$("[data-wipe]").onclick=()=>confirmar("¿Borrar TODOS los datos? Esto no se puede deshacer. Haz una copia de seguridad antes.",()=>{
    DB.wipe();state=datosEjemplo();DB.save(state);aplicarTema();toast("Datos borrados");navegar("inicio");});

  // Color pickers (en modales)
  $$('[id^="eColor"] button,[id^="hColor"] button,[id^="sColor"] button,[id$="Color"] button').forEach(b=>{
    b.onclick=()=>{const cont=b.parentElement;cont.dataset.sel=b.dataset.c;
      $$("button",cont).forEach(x=>x.style.border="3px solid transparent");b.style.border="3px solid #fff";};
  });
}
// Sobrescribe colorSel para leer del contenedor
function colorSel(id){ const c=$("#"+id); return c?.dataset.sel || c?.querySelector('button[style*="#fff"]')?.dataset.c || COLORES[0]; }

/* Botón tema en topbar */
$("#btnTema").onclick=toggleTema;

/* Modo privacidad: oculta los importes con ••••• (como las apps de banco) */
function actualizarBotonPrivacidad(){
  const b=$("#btnPrivacidad"); if(!b) return;
  const oculto=state.config.ocultarMontos;
  b.innerHTML = oculto
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.4 4.3A9.8 9.8 0 0112 4c7 0 11 8 11 8a18 18 0 01-2.2 3.2M6.3 6.3A18 18 0 001 12s4 8 11 8a9.7 9.7 0 004.2-.9"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  b.style.color = oculto ? 'var(--accent)' : 'var(--txt)';
}
function togglePrivacidad(){
  state.config.ocultarMontos=!state.config.ocultarMontos;
  guardar(); actualizarBotonPrivacidad(); render();
  toast(state.config.ocultarMontos?'Importes ocultos 🙈':'Importes visibles 👀');
}
$("#btnPrivacidad").onclick=togglePrivacidad;
actualizarBotonPrivacidad();

/* ============================================================
   PWA: registro de Service Worker
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{/* offline opcional */});
  });
}

/* ============================================================
   ARRANQUE
   ============================================================ */
const _origSaved=state.meta?.savedAt;   // hora real del último guardado, antes de tocar nada
const _ac=autoConfirmarPlaneadas();     // confirma turnos planeados ya pasados (local)
aplicarTema();
render();
if(_ac) setTimeout(()=>toast(`${_ac} turno(s) planeado(s) ya pasado(s) → confirmado(s)`,"ok"),1000);
setTimeout(()=>sincronizarInicio(_origSaved), 800);  // trae/sube lo más reciente al abrir
if(primeraVez) setTimeout(()=>toast("¡Bienvenida! Empieza creando tu ETT en los 3 pasos.","ok"),600);
</script>
